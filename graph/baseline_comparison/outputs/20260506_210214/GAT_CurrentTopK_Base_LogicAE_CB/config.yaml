experiment_name: GAT_CurrentTopK_Base_LogicAE_CB
model: GAT
graph_protocol: current_topk
edge_set: Base_LogicAE_CB
relation_handling: homogeneous_union_graph
feature_source: user_scores_enriched.csv + user_abnormal_vectors.npy
hidden_dim: 144
num_layers: 1
heads: 4
num_bases: UNKNOWN_FROM_D1
optimizer: AdamW
lr: 0.001
weight_decay: 0.0005
dropout: 0.2
epochs: 100
patience: 16
early_stopping_metric: val_auc
loss_function: BCEWithLogitsLoss
class_weight: balanced_pos_weight
threshold_selection: validation_f1
feature_normalization: standardize_like_D1_global
blocked_label_columns: UNKNOWN_FROM_D1
seed: 42
notes: Aligned to D1 current-topk protocol where recoverable; union graph merges duplicate
  directed edges by summing weights but GAT backbone itself is topology-only.
unknown_from_d1:
- blocked_label_columns
