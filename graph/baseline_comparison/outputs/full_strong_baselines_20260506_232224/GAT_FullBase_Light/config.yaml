experiment_name: GAT_FullBase_Light
model: GAT
graph_protocol: full_base
relations: UPU,UTU,USU
relation_handling: homogeneous_union_graph
feature_source: logic_vectors/user_summary.csv numeric behavior features only
hidden_dim: 64
num_layers: 2
heads: 2
num_bases: UNKNOWN_FROM_D1
use_neighbor_sampling: false
optimizer: AdamW
lr: 0.001
weight_decay: 0.0005
dropout: 0.2
epochs: 100
patience: 16
early_stopping_metric: val_auc
loss_function: BCEWithLogitsLoss
class_weight: balanced_pos_weight
threshold_selection: validation_f1
feature_normalization: standardize_like_D1_global
blocked_label_columns: label,user_label,review_label,is_fake,is_real,fake_ratio,fake_review_count,is_fake_user
seed: 42
notes: FullBase_UPU_UTU_USU graph baseline. Light full-graph GAT with heads=2 and
  hidden_dim=64 for 24GB safety. No LogicAE, no TNS, no abnormal compression, no LLM
  mask.
unknown_from_d1:
- hidden_dim
- heads
